version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so a compromised release
    # that gets pulled quickly never reaches this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(dependencies): "

  # Claude Code CLI used by the Claude review action (package-lock.json)
  - package-ecosystem: "npm"
    directory: "/.github/actions/claude-review"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(dependencies): "
