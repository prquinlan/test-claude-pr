# Creates a GitHub release from conventional commits using the
# health-informatics-uon/workflows semantic-release reusable workflow.
# No container or PyPI publishing: this repo ships neither a Dockerfile nor a package.

name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@e0603aaa45d8ecfcb1797d0bf8b8206f551c41ef # v 1.8.2
    with:
      node-version: "24"
