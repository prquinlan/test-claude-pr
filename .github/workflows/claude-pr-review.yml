name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main, master]
    paths:
      - '**.py'
      - '**.r'
      - '**.R'
      - '**.jl'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      # Lines changed come straight from the event payload, so no API call is needed.
      - name: Check PR size
        id: size
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          MAX_LINES: 1000
        run: |
          lines=$((ADDITIONS + DELETIONS))
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "too-large=true" >> "$GITHUB_OUTPUT"
          else
            echo "too-large=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if PR is too large
        if: steps.size.outputs.too-large == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          LINES: ${{ steps.size.outputs.lines }}
        run: |
          gh pr comment "$PR_URL" \
            --body "PR too large for automated review (${LINES} lines changed, limit 1000). Consider splitting it up."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.size.outputs.too-large == 'false'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        if: steps.size.outputs.too-large == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot] using the built-in token instead of the Claude GitHub App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
