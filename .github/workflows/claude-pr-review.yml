name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write # Allows posting review comments; contents: read blocks pushes

# Cancel older in-progress runs if new commits are pushed to the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (no secrets) and Dependabot (no secrets)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Skip the review for PRs over MAX_LINES changed lines (additions + deletions).
      # Lines changed come straight from the event payload, so no API call is needed.
      - name: Check PR size
        id: size
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          MAX_LINES: 1000
        run: |
          lines=$((ADDITIONS + DELETIONS))
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "too-large=true" >> "$GITHUB_OUTPUT"
          else
            echo "too-large=false" >> "$GITHUB_OUTPUT"
          fi

      # Comment once per PR, not on every push, by looking for a hidden marker.
      - name: Comment if PR is too large
        if: steps.size.outputs.too-large == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          LINES: ${{ steps.size.outputs.lines }}
        run: |
          marker="<!-- claude-review-too-large -->"
          if gh pr view "$PR_URL" --json comments -q '.comments[].body' | grep -qF "$marker"; then
            echo "Too-large comment already posted; skipping review."
            exit 0
          fi
          gh pr comment "$PR_URL" --body "$marker
          PR too large for automated review (${LINES} lines changed, limit 1000). Consider splitting it up."

      - name: Checkout PR code
        if: steps.size.outputs.too-large == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Runs the Claude Code CLI directly rather than anthropics/claude-code-action:
      # with an API key, the action's requests were rejected with "Credit balance is
      # too low" even though the same key works when called directly.
      - name: Use trusted Claude config from the base branch
        if: steps.size.outputs.too-large == 'false'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The PR head is untrusted: never let it supply Claude settings, hooks,
          # MCP servers or instructions. Replace them with the base branch's copies.
          paths=".claude .claude.json .mcp.json CLAUDE.md CLAUDE.local.md"
          rm -rf $paths
          git fetch --depth 1 origin "$BASE_REF"
          for p in $paths; do
            git checkout FETCH_HEAD -- "$p" 2>/dev/null || true
          done

      - name: Install Claude Code
        if: steps.size.outputs.too-large == 'false'
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Run Claude Code Review
        if: steps.size.outputs.too-large == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          comments_api="repos/${REPO}/pulls/${PR_NUMBER}/comments"

          prompt=$(cat <<EOF
          REPO: ${REPO}
          PR NUMBER: ${PR_NUMBER}
          HEAD COMMIT: ${HEAD_SHA}

          Use "gh pr view ${PR_NUMBER}" and "gh pr diff ${PR_NUMBER}" to see what changed;
          read surrounding files only as needed.
          Review it against REVIEW.md (and CLAUDE.md, if present).

          Post each finding as a concise, actionable inline comment on the line involved,
          using exactly this command shape (the body is read from the heredoc, so any
          characters are safe in it):

          gh api ${comments_api} -f commit_id=${HEAD_SHA} -f path=FILE_PATH -F line=LINE_NUMBER -f side=RIGHT -F body=@- <<'COMMENT'
          Your comment text here.
          COMMENT

          Then post one PR comment with "gh pr comment ${PR_NUMBER} --body-file -" (body via
          a heredoc the same way) containing any PR-level notes REVIEW.md asks for; if there
          are no inline findings, say so in that comment so it is clear the review ran.
          EOF
          )

          claude -p "$prompt" \
            --model claude-sonnet-5-5 \
            --max-turns 15 \
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh api ${comments_api}:*)"
