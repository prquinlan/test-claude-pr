name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write # Allows posting review comments; contents: read blocks pushes

# Cancel older in-progress runs if new commits are pushed to the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (no secrets) and Dependabot (no secrets)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Don't leave the GitHub token in .git/config, where Claude could read it.
          persist-credentials: false

      # Once in the UoN workflows repo, this becomes
      # health-informatics-uon/workflows/.github/actions/claude-review@<sha>
      - name: Claude review
        uses: ./.github/actions/claude-review
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
