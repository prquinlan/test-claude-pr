name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write # Allows posting review comments; contents: read blocks pushes

# Cancel older in-progress runs if new commits are pushed to the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (no secrets) and Dependabot (no secrets)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Skip the review for PRs over MAX_LINES changed lines (additions + deletions).
      # Lines changed come straight from the event payload, so no API call is needed.
      - name: Check PR size
        id: size
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          MAX_LINES: 1000
        run: |
          lines=$((ADDITIONS + DELETIONS))
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "too-large=true" >> "$GITHUB_OUTPUT"
          else
            echo "too-large=false" >> "$GITHUB_OUTPUT"
          fi

      # Comment once per PR, not on every push, by looking for a hidden marker.
      - name: Comment if PR is too large
        if: steps.size.outputs.too-large == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          LINES: ${{ steps.size.outputs.lines }}
        run: |
          marker="<!-- claude-review-too-large -->"
          if gh pr view "$PR_URL" --json comments -q '.comments[].body' | grep -qF "$marker"; then
            echo "Too-large comment already posted; skipping review."
            exit 0
          fi
          gh pr comment "$PR_URL" --body "$marker
          PR too large for automated review (${LINES} lines changed, limit 1000). Consider splitting it up."

      - name: Checkout PR code
        if: steps.size.outputs.too-large == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Don't leave the GitHub token in .git/config, where Claude could read it.
          persist-credentials: false

      # Fetch the PR here so the Claude step needs no GitHub token and no shell.
      # Comments are not fetched: anyone can post them, so they could carry injected
      # instructions.
      - name: Fetch PR for review
        if: steps.size.outputs.too-large == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf .pr-review
          mkdir .pr-review
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json title,body,author,baseRefName,headRefName,files > .pr-review/pr.json
          gh pr diff "$PR_NUMBER" --repo "$REPO" > .pr-review/pr.diff

      - name: Install Claude Code
        if: steps.size.outputs.too-large == 'false'
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      # Claude can only read files inside the checkout. It returns findings as JSON;
      # the next step posts them.
      # Runs the Claude Code CLI directly rather than anthropics/claude-code-action:
      # with an API key, the action's requests were rejected with "Credit balance is
      # too low" even though the same key works when called directly.
      - name: Run Claude Code Review
        if: steps.size.outputs.too-large == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          schema='{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}},"summary":{"type":"string"}},"required":["findings","summary"]}'

          prompt=$(cat <<EOF
          REPO: ${REPO}
          PR NUMBER: ${PR_NUMBER}

          The PR details are in .pr-review/pr.json and the diff is in .pr-review/pr.diff;
          read surrounding files only as needed.
          Review it against REVIEW.md (and CLAUDE.md, if present).

          Do not post anything yourself. Return:
          - findings: one entry per issue, with the file path, the line number in the new
            version of the file (it must be a line inside the diff), and a concise,
            actionable comment.
          - summary: a brief overview of the review. If there are no findings,
            say so, so it is clear the review ran.
          EOF
          )

          # --setting-sources user: ignore any .claude/settings.json in the repo, so it
          # can't change which tools Claude may use or add hooks.
          # Read, Grep and Glob are allowed only inside the checkout; in print mode
          # anything else is refused, including symlinks that point outside it.
          # The deny list is a backstop for the places that hold secrets
          # (/proc/self/environ has the API key).
          allow="Read(./**),Grep(./**),Glob(./**)"
          deny="Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//root/**),Read(//tmp/**),Read(//run/**),Read(//var/**),Read(~/.*/**)"

          claude -p "$prompt" \
            --model claude-sonnet-5-5 \
            --max-turns 15 \
            --setting-sources user \
            --output-format json \
            --json-schema "$schema" \
            --allowedTools "$allow" \
            --disallowedTools "$deny" \
            > "$RUNNER_TEMP/review.json"

          jq '{is_error, num_turns, total_cost_usd, permission_denials}' "$RUNNER_TEMP/review.json"
          if [ "$(jq -r '.is_error' "$RUNNER_TEMP/review.json")" != "false" ] \
             || [ "$(jq -r '.structured_output | type' "$RUNNER_TEMP/review.json")" != "object" ]; then
            echo "::error::Claude review did not complete"
            jq -r '.result // empty' "$RUNNER_TEMP/review.json"
            exit 1
          fi

      - name: Post review comments
        if: steps.size.outputs.too-large == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/review.json"
          posted=0
          unanchored=""
          count=$(jq '.structured_output.findings | length' "$out")
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".structured_output.findings[$i].path" "$out")
            line=$(jq -r ".structured_output.findings[$i].line" "$out")
            body=$(jq -r ".structured_output.findings[$i].body" "$out")
            if printf '%s' "$body" | gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
                 -f commit_id="$HEAD_SHA" -f path="$path" -F line="$line" -f side=RIGHT \
                 -F body=@- > /dev/null; then
              posted=$((posted + 1))
            else
              # Line not in the diff: keep the finding in the summary instead.
              unanchored="${unanchored}
          - \`${path}:${line}\`: ${body}"
            fi
          done

          summary=$(jq -r '.structured_output.summary' "$out")
          {
            printf '**Claude review:** %s inline finding(s).\n\n%s\n' "$posted" "$summary"
            if [ -n "$unanchored" ]; then
              printf '\n**Findings that could not be attached to a diff line:**%s\n' "$unanchored"
            fi
          } | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file -
