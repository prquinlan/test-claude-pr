name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

jobs:
  claude:
    # Once in the UoN workflows repo, this becomes
    # health-informatics-uon/workflows/.github/workflows/claude-review.yml@<sha>
    uses: $/.github/workflows/claude-review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
